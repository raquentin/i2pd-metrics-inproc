name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
        cd submodules/i2pd
        git checkout 896f548175aa605efd15ecbfb744588e0c14f64f

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          g++ \
          libboost-system-dev \
          libboost-filesystem-dev \
          libboost-program-options-dev \
          libboost-date-time-dev \
          libssl-dev \
          zlib1g-dev \
          curl

    - name: Build and test
      run: |
        make
        make test
